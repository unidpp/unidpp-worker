openapi: 3.1.0
info:
  title: UniDPP — the one deployment
  version: 0.1.0
  description: 'UniDPP serves the whole estate as one deployment: every module (registry, trust, log, issuer, views, render, archive, relay, console, identity) keeps its own contract behind its prefix, and this document is the union of them. Each module''s golden document is served byte-identically at `/<module>/openapi.yaml`; this document exists so a client of the whole deployment reads one surface.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-unidpp-env-keys:
  - UNIDPP_REGISTRY_BIND
  - UNIDPP_REGISTRY_ADMIN_TOKEN
  - UNIDPP_REGISTRY_STATE_FILE
  - UNIDPP_REGISTRY_SEED_ON_DEMAND
  - UNIDPP_REGISTRY_SEED_EXPRESS
  - UNIDPP_TRUST_BIND
  - UNIDPP_TRUST_ADMIN_TOKEN
  - UNIDPP_TRUST_STATE_FILE
  - UNIDPP_TRUST_NO_SEED_FIXTURES
  - UNIDPP_TRUST_DEV_SEED
  - UNIDPP_TRUST_SIGN_SEED
  - UNIDPP_TRUST_SIGN_SEED_P256
  - UNIDPP_LOG_BIND
  - UNIDPP_LOG_ID
  - UNIDPP_LOG_SUITE
  - UNIDPP_LOG_SEED
  - UNIDPP_LOG_APPEND_TOKEN
  - UNIDPP_LOG_STATE_FILE
  - UNIDPP_LOG_EXTERNAL_TSA_URL
  - UNIDPP_ISSUER_BIND
  - UNIDPP_ISSUER_ADMIN_TOKEN
  - UNIDPP_ISSUER_STATE_FILE
  - UNIDPP_ISSUER_REGISTRY_URL
  - UNIDPP_ISSUER_REGISTRY_TOKEN
  - UNIDPP_ISSUER_MAX_AGE
  - UNIDPP_ISSUER_EVENT_SEED
  - UNIDPP_ISSUER_PACK_SEED
  - UNIDPP_ISSUER_PACK_SUITE
  - UNIDPP_ISSUER_SEED
  - UNIDPP_PROJECTOR_BIND
  - UNIDPP_REGISTRY_URL
  - UNIDPP_PROJECTOR_REGISTRY_TOKEN
  - UNIDPP_PROJECTOR_PASSPORTS_DIR
  - UNIDPP_PROJECTOR_PRIMMEL_DIR
  - UNIDPP_PROJECTOR_ROLLUP_SEED
  - UNIDPP_PROJECTOR_ROLLUP_ATTESTER
  - UNIDPP_GATEWAY_BIND
  - UNIDPP_ISSUER_URL
  - UNIDPP_GATEWAY_ISSUER_URL
  - UNIDPP_GATEWAY_FEEDBACK_JOURNAL
  - UNIDPP_GATEWAY_FEEDBACK_RATE
  - UNIDPP_GATEWAY_ADMIN_TOKEN
  - UNIDPP_GATEWAY_SCAN_TTL_SECS
  - UNIDPP_GATEWAY_SCAN_LIMIT_PER_MIN
  - UNIDPP_GATEWAY_TIMEOUT_MS
  - UNIDPP_ARCHIVE_BIND
  - UNIDPP_ARCHIVE_ADMIN_TOKEN
  - UNIDPP_ARCHIVE_STATE_FILE
  - UNIDPP_ARCHIVE_SNAPSHOT_DIR
  - UNIDPP_ARCHIVE_DEV_SEED
  - UNIDPP_ARCHIVE_SIGN_SEED
  - UNIDPP_LOG_URL
  - UNIDPP_ARCHIVE_LOG_TOKEN
  - UNIDPP_ARCHIVE_LOG_TIMEOUT_MS
  - UNIDPP_HUB_BIND
  - UNIDPP_HUB_ID
  - UNIDPP_HUB_SEED
  - UNIDPP_CONSOLE_BIND
  - UNIDPP_CONSOLE_MANIFEST
  - UNIDPP_CONSOLE_ADMIN_TOKEN
  - UNIDPP_IDENTITY_STATE_FILE
  - UNIDPP_SERVER_OPERATOR_TOKEN
servers:
- url: /
tags:
- description: 'The ISO 19135 register: items, subregisters, cross-register mappings, the manifest schema'
  name: register
- description: Profile-to-product-type bindings and their clock predicates
  name: applicability
- description: 'The discovery registry: C3 services, C4 protocol bindings, C5 verification mechanisms'
  name: discovery
- description: EXPRESS and CDDAL semantic model deposits
  name: models
- description: 'The operator surface: the audit log and seeding'
  name: admin
- description: 'The public surface: discovery, health, keyring, graph, anchor bundle, trust lists, master list, revocations, operators, evidence'
  name: trust
- description: 'The transparency-log surface: discovery, commitment sequencing, signed tree heads, consistency proofs and receipts'
  name: log
- description: 'Discovery, health, the public keyring and the passport lifecycle: creation, event appendage, pack minting, the document view and the verdict'
  name: issuance
- description: The twin-fold view and the consumer render
  name: projection
- description: Protocol renderings, the report channel and the scan-policy gate
  name: gateway
- description: 'The public surface: discovery, health, the notary keyring, snapshot access and the as-of catalogue'
  name: archive
- description: 'The hub surface: discovery, liveness, the keyring, the relay and its verification'
  name: hub
- description: The session-gated operator surface
  name: console
- description: Actors, credentials and the scope table
  name: identity
paths:
  /registry/:
    get:
      operationId: discovery
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: 'The discovery document: endpoint references, item classes, statuses, subregister mounts, as-of semantics, content negotiation, intake checks and the auth posture'
      summary: Serve the discovery document.
      tags:
      - register
  /registry/admin/log:
    get:
      operationId: admin_log
      parameters:
      - description: Records to return (default 100, maximum 10 000)
        in: query
        name: limit
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
      - description: Records to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The journal window
        '401':
          description: A bearer token is configured and the request does not carry it
      summary: |-
        GET /admin/log — the append-only audit log (admin, paged).
        Read the append-only audit log.
      tags:
      - admin
  /registry/admin/seed:
    post:
      operationId: admin_seed
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The seed report
        '401':
          description: A bearer token is configured and the request does not carry it
        '403':
          description: Seeding on demand is disabled
      summary: |-
        `POST /admin/seed` — idempotent: populates the seed dataset only once
        per process (or until the journal is wiped). Returns a summary of
        counts registered. Disabled with `UNIDPP_REGISTRY_SEED_ON_DEMAND=0`.
        Seed the register with the development corpus (refused when
        `UNIDPP_REGISTRY_SEED_ON_DEMAND` is off).
      tags:
      - admin
  /registry/applicability:
    get:
      operationId: applicability_query
      parameters:
      - description: 'The product type (alias: `subject`)'
        in: query
        name: product_type
        required: false
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      - description: A JSON object of subject facts for predicate evaluation
        in: query
        name: subject_facts
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The applicability evaluation, as-of stamped
        '400':
          description: A missing `product_type` or malformed `subject_facts`
      summary: |-
        GET /applicability?product_type=&at=&subject_facts= — which
        profiles applied at `at` (legal as-of semantics: retroactive
        bindings apply from their `effective_from`; non-retroactive ones
        only from `registered_at`). With `subject_facts` (a JSON object),
        clock predicates on the bound profiles' manifests are evaluated
        at the query instant: a time-triggered profile binds only once
        its threshold (`basis + duration`) is crossed. Fact predicates
        are evaluated locally by the subject's custodian, never here.
        Evaluate applicability bindings for a product type, optionally
        against supplied subject facts (the clock predicates run against
        the facts).
      tags:
      - applicability
    post:
      operationId: bind_applicability
      requestBody:
        content:
          application/json:
            schema: {}
        description: 'The binding: `{product_type, profile_id, ...window and retroactivity fields}`; or an evaluation request `{product_type, subject_facts, at?}`'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The evaluation result (when the body is an evaluation request)
        '201':
          content:
            application/json:
              schema: {}
          description: Bound; the binding view is stated
        '400':
          description: An invalid body, or `subject_facts` combined with `profile_id`
        '401':
          description: A bearer token is configured and the request does not carry it
      summary: |-
        POST /applicability — bind a profile to a product type with an
        effective window and a retroactivity flag.
        Bind a profile to a product type with an effective window and a
        retroactivity flag. A body carrying `subject_facts` and no
        `profile_id` is an evaluation request, not a mutation.
      tags:
      - applicability
  /registry/cross-register-mappings:
    get:
      operationId: mappings_get_or_list
      parameters:
      - description: 'Directional lookup: the mapped item'
        in: query
        name: item
        required: false
        schema:
          type: string
      - description: 'Directional lookup: the source register'
        in: query
        name: source
        required: false
        schema:
          type: string
      - description: 'Directional lookup: the target register'
        in: query
        name: target
        required: false
        schema:
          type: string
      - description: Filter by register id
        in: query
        name: register
        required: false
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The listing or the directional result, as-of stamped
      summary: |-
        GET /cross-register-mappings — with `item`/`source`/`target`
        filters, the directional lookup; without them, the generic
        class-scoped listing (content-negotiated like every listing).
        List cross-register mappings; with `item`, `source` or `target`
        present this is the directional lookup.
      tags:
      - register
    post:
      operationId: mappings_create
      requestBody:
        content:
          application/json:
            schema: {}
        description: The mapping item and its first version
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Registered; the item view is stated
        '400':
          description: An invalid body or a failed mapping-integrity check
        '401':
          description: A bearer token is configured and the request does not carry it
        '409':
          description: The mapping is already registered
      summary: |-
        Register a cross-register mapping (ISO 19135 harmonization: a
        mapping between items of two registers is itself a registered
        item).
      tags:
      - register
  /registry/cross-register-mappings/{id}:
    get:
      operationId: mappings_get_one
      parameters:
      - description: The mapping identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The mapping view, as-of stamped
        '404':
          description: No such mapping as of the requested instant
      summary: Retrieve one cross-register mapping as of an instant.
      tags:
      - register
  /registry/cross-register-mappings/{id}/supersession:
    get:
      operationId: mappings_chain
      parameters:
      - description: The mapping identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Start the chain at this version
        in: query
        name: from
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The chain, as-of stamped
        '404':
          description: No such mapping
      summary: The supersession chain of a cross-register mapping.
      tags:
      - register
  /registry/cross-register-mappings/{id}/versions:
    post:
      operationId: mappings_supersede_one
      requestBody:
        content:
          application/json:
            schema: {}
        description: The successor version and its manifest
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Superseded; the new version, the superseded version and the item view are stated
        '400':
          description: No valid version to supersede or an invalid body
        '401':
          description: A bearer token is configured and the request does not carry it
      summary: Supersede a cross-register mapping with a new version.
      tags:
      - register
  /registry/healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: The service is serving
      summary: Liveness probe.
      tags:
      - register
  /registry/items:
    get:
      operationId: list_all_items
      parameters:
      - description: Filter by item class
        in: query
        name: class
        required: false
        schema:
          type: string
      - description: Filter by register id
        in: query
        name: register
        required: false
        schema:
          type: string
      - description: 'An RFC 3339 instant; the listing is stated as of that instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The listing, as-of stamped
      summary: |-
        List registered items (content-negotiated; `Accept: text/cddal`
        serves the canonical dictionary form).
      tags:
      - register
    post:
      operationId: create_items
      requestBody:
        content:
          application/json:
            schema: {}
        description: 'The item and its first version: `{register_id, item_id, class, definition, version, status: valid}`'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Registered; the item view is stated
        '400':
          description: An invalid body or a failed intake check
        '401':
          description: A bearer token is configured and the request does not carry it
        '409':
          description: The item is already registered
      summary: Register a new ISO 19135 item with its first version.
      tags:
      - register
  /registry/items/{id}:
    get:
      operationId: get_one_item
      parameters:
      - description: The item identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The item view, as-of stamped
        '404':
          description: No such item as of the requested instant
      summary: Retrieve one item as of an instant.
      tags:
      - register
  /registry/items/{id}/supersession:
    get:
      operationId: one_item_chain
      parameters:
      - description: The item identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Start the chain at this version
        in: query
        name: from
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The chain, as-of stamped
        '404':
          description: No such item
      summary: The supersession chain of an item.
      tags:
      - register
  /registry/items/{id}/versions:
    post:
      operationId: supersede_one_item
      requestBody:
        content:
          application/json:
            schema: {}
        description: The successor version and its manifest; an explicit `supersede_version` names the version to supersede, otherwise the current valid version is superseded
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Superseded; the new version, the superseded version and the item view are stated
        '400':
          description: No valid version to supersede, a manifest pin that matches no registered version, or an invalid body
        '401':
          description: A bearer token is configured and the request does not carry it
      summary: |-
        Supersede an item's current version with a new one
        (append-only; the window of the superseded version closes).
      tags:
      - register
  /registry/models:
    get:
      operationId: list_models
      parameters:
      - description: Filter by register id
        in: query
        name: register
        required: false
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The listing, as-of stamped
      summary: |-
        GET /models — list deposited models with their validation status.
        List deposited models.
      tags:
      - models
    post:
      operationId: deposit_model
      requestBody:
        content:
          application/json:
            schema: {}
        description: '`{register_id, item_id, title, version, source, submitting_organization?}`'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Deposited; the content hash and the validation status are stated
        '400':
          description: An invalid body or a rejected (invalid) model
        '401':
          description: A bearer token is configured and the request does not carry it
        '409':
          description: The model is already deposited
      summary: |-
        POST /models — deposit an EXPRESS model: source text + metadata;
        content hash over the exact bytes; expressir validation
        (subprocess; `pending` when the binary is absent; `invalid`
        deposits are rejected).
        Deposit an EXPRESS (or CDDAL) semantic model: source text plus
        metadata; the content hash covers the exact bytes and expressir
        validates the source (pending when the binary is absent; invalid
        deposits are rejected).
      tags:
      - models
  /registry/models/{id}:
    get:
      operationId: get_model
      parameters:
      - description: The model identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      - description: Pin the retrieval to this content hash
        in: query
        name: hash
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The model record, as-of stamped
        '404':
          description: No such model, or the pinned hash matches no deposit
      summary: |-
        GET /models/{id}?at=&hash= — the deposited source, its content
        hash and validation status. With `hash=`, retrieval is pinned to
        that hash (mismatch → 409).
        Retrieve a deposited model; hash-pinned retrieval names an exact
        byte form.
      tags:
      - models
  /registry/models/{id}/validate:
    post:
      operationId: validate_model
      parameters:
      - description: The model identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The validation report
        '401':
          description: A bearer token is configured and the request does not carry it
        '404':
          description: No such model
      summary: |-
        POST /models/{id}/validate — re-run expressir validation over the
        stored source and record the outcome (the degrade path: deposits
        stored `pending` become `valid`/`invalid` once expressir is
        available).
        Re-run expressir validation over a deposited model.
      tags:
      - models
  /registry/protocol-bindings:
    get:
      operationId: list_protocol_bindings
      parameters:
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The listing, as-of stamped
      summary: |-
        `GET /protocol-bindings` — list all registered protocol bindings.
        List registered C4 protocol bindings.
      tags:
      - discovery
    post:
      operationId: create_protocol_binding
      requestBody:
        content:
          application/json:
            schema: {}
        description: The signed protocol binding descriptor
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Registered; the stored record is stated
        '400':
          description: The descriptor or its signature fails the intake checks
        '401':
          description: A bearer token is configured and the request does not carry it
      summary: |-
        `POST /protocol-bindings` — register a signed C4 protocol binding.
        Register a signed C4 protocol binding descriptor.
      tags:
      - discovery
  /registry/protocol-bindings/{id}:
    get:
      operationId: get_protocol_binding
      parameters:
      - description: The protocol binding identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The descriptor
        '404':
          description: No such protocol binding
      summary: |-
        `GET /protocol-bindings/{id}` — a single protocol binding.
        Retrieve one C4 protocol binding descriptor.
      tags:
      - discovery
  /registry/schemas/profile-manifest:
    get:
      operationId: get_profile_manifest_schema
      parameters:
      - description: 'An RFC 3339 instant for the as-of stamp (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/schema+json:
              schema: {}
          description: The JSON Schema, as-of stamped
      summary: |-
        GET /schemas/profile-manifest — the JSON Schema (draft 2020-12)
        generated from the canonical manifest model. The `as_of` member
        is serving metadata (not a validation keyword; draft 2020-12
        validators ignore it); the schema version rides in `$id`.
        The generated JSON Schema of a profile manifest.
      tags:
      - register
  /registry/services:
    get:
      operationId: list_services
      parameters:
      - description: Filter by service class
        in: query
        name: class
        required: false
        schema:
          type: string
      - description: Filter by jurisdiction
        in: query
        name: jurisdiction
        required: false
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The listing, as-of stamped
      summary: |-
        `GET /services` — list services with optional `class=` and
        `jurisdiction=` filters and `at=` point-in-time semantics.
        List registered C3 service descriptors.
      tags:
      - discovery
    post:
      operationId: create_service
      requestBody:
        content:
          application/json:
            schema: {}
        description: The signed service descriptor
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Registered; the stored record is stated
        '400':
          description: The descriptor or its signature fails the intake checks
        '401':
          description: A bearer token is configured and the request does not carry it
      summary: |-
        `POST /services` — register a signed C3 service descriptor.
        Register a signed C3 service descriptor (the signature is
        verified against the operator keyring at intake).
      tags:
      - discovery
  /registry/services/{id}:
    get:
      operationId: get_service
      parameters:
      - description: The service identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'An RFC 3339 instant (alias: `asof`)'
        in: query
        name: at
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The descriptor, as-of stamped
        '404':
          description: No such service as of the requested instant
      summary: |-
        `GET /services/{id}` — a single service descriptor with the version
        in force at `at`.
        Retrieve one C3 service descriptor as of an instant.
      tags:
      - discovery
  /registry/services/{id}/supersession:
    get:
      operationId: service_chain
      parameters:
      - description: The service identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Start the chain at this version
        in: query
        name: from
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The chain, as-of stamped
        '404':
          description: No such service
      summary: |-
        `GET /services/{id}/supersession` — the supersession chain for a
        service descriptor.
        The supersession chain of a C3 service descriptor.
      tags:
      - discovery
  /registry/services/{id}/versions:
    post:
      operationId: supersede_service
      requestBody:
        content:
          application/json:
            schema: {}
        description: The signed successor descriptor
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Superseded; the stored record is stated
        '400':
          description: The descriptor or its signature fails the intake checks
