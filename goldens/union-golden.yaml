        '409':
          description: The storage reports a sequence conflict
        '500':
          description: Notarization failed or the storage reported an integrity failure
      summary: |-
        Ingest a snapshot: the OAIS submission is notarized into the
        archival package.
      tags:
      - admin
  /archive/snapshots/{id}:
    get:
      operationId: get_snapshot
      parameters:
      - description: The snapshot identifier, as returned by the ingest response and the as-of catalogue
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The archival package is re-rendered from the journaled record byte-identically; the strong `ETag` pins the body digest and the `X-As-Of` header carries the notarization instant
        '404':
          description: No snapshot carries the requested identifier
      summary: Re-serve a stored snapshot byte-identically (OAIS access).
      tags:
      - archive
  /relay/:
    get:
      operationId: discovery
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: 'The discovery document: the service identity, the hub id, the endpoint map and the contract statements — statelessness, two-way willingness, signed relays, no master'
      summary: Serve the discovery document.
      tags:
      - hub
  /relay/healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The service is serving
      summary: Answer the liveness probe.
