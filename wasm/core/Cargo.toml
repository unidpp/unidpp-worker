[package]
name = "unidpp-core-wasm"
version = "0.1.0"
edition = "2021"
description = "UniDPP's core algorithms for the Workers port: digests and tree-head signing over the model and signatif crates, byte-exact with the native binaries and the vector corpus"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unidpp-event = { path = "../../../unidpp-core/crates/event" }
unidpp-model = { path = "../../../unidpp-core/crates/model" }
unidpp-signatif = { path = "../../../unidpp-signatif" }

# The wasm target: getrandom 0.2 (a transitive dep of the signing
# stack) needs its js bindings on unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2" }

# The wasm build links the shim (above) in place of crates.io's
# getrandom so the module carries no imports.
[patch.crates-io]
getrandom = { path = "../getrandom-stub" }
